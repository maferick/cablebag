# Checks every push to main and every pull request: frontend types (svelte-check) and the backend unit
# tests (cargo test --lib), on Windows and on Linux. Nothing is signed or published here; releases are made
# from main on the maintainer's PC by scripts/release.mjs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Check the frontend (svelte-check)
        run: npx svelte-check --tsconfig ./tsconfig.json --threshold error

      # tauri::generate_context!() in the backend refuses to compile when frontendDist (../build) does not
      # exist, so the frontend is built before the backend tests.
      - name: Build the frontend
        run: npm run build

      - name: Install Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config libssl-dev

      # The Windows bundle lists ../rdp-helper/publish/cablebag-rdp.exe as a resource, and tauri-build
      # checks that resources exist while compiling the backend, so the helper is built first on Windows.
      - name: Set up .NET 8 SDK (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build the Remote Desktop helper (Windows)
        if: runner.os == 'Windows'
        run: npm run build:rdp

      # The Windows bundle also lists the X server (../xserver/vcxsrv/), fetched from its official release and
      # checked against the checksum in scripts/xserver.json; the download is cached between runs.
      - name: Cache the X server download (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: xserver/cache
          key: xserver-${{ hashFiles('scripts/xserver.json') }}

      - name: Fetch the X server (Windows)
        if: runner.os == 'Windows'
        run: npm run build:xserver

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test the backend (cargo test --lib)
        working-directory: src-tauri
        run: cargo test --lib
