# Weekly update pull requests, grouped: minor and patch versions in one PR, major versions in another (those
# usually need code changes, and CI shows what breaks). Security fixes come separately, as soon as an advisory
# is out (Dependabot security updates are on).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # windows-future 0.100 needs the windows crate at 0.100 too, which Tauri does not use yet.
      - dependency-name: windows-future
        update-types: ["version-update:semver-major"]
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
      rust-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # SvelteKit and svelte-check support TypeScript 6 at most; 7 comes when they do.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: nuget
    directory: /rdp-helper
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
